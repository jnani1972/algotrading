name: ChatGPT NSE Bmin >1pct Backtest
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run NSE Bmin >1pct backtest
        run: python3 chatgpt_backtest_bmin1.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: nse-bmin1-results
          path: |
            nse_bmin1_summary.csv
            nse_bmin1_trades.csv
            nse_bmin1_quality.csv
            nse_bmin1_aggregate.json
          if-no-files-found: error
